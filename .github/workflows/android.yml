name: Build Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: bash scripts/prepare-android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify and name APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Data-Usage-Tracker.apk
          unzip -tq dist/Data-Usage-Tracker.apk
          sha256sum dist/Data-Usage-Tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Data-Usage-Tracker
          path: dist/Data-Usage-Tracker.apk
          if-no-files-found: error
